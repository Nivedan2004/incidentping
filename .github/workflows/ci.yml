name: Continuous Integration

# Validate PRs and changes merged into main
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Use read-only repository permissions
permissions:
  contents: read

# Cancel outdated workflow runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package Lambda Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only package after validation succeeds
    needs: validate

    # Generate release artifacts only for main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Install dependencies required for compilation
      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Create an isolated deployment directory
      - name: Prepare deployment directory
        run: |
          mkdir -p deployment
          cp -R dist deployment/
          cp package.json package-lock.json deployment/

      # Install only production dependencies for Lambda
      - name: Install production dependencies
        working-directory: deployment
        run: npm ci --omit=dev --os=linux --cpu=x64

      # Verify the Lambda entry point exists
      - name: Validate deployment package
        run: |
          test -f deployment/dist/lambda.js
          test -d deployment/node_modules
          test -f deployment/package.json

      # Package the application without environment files
      - name: Create Lambda deployment ZIP
        working-directory: deployment
        run: |
          zip -qr ../incidentping-deployment.zip \
            dist node_modules package.json

      - name: Display package size
        run: ls -lh incidentping-deployment.zip

      # Make the deployment ZIP available for download
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: incidentping-lambda-${{ github.sha }}
          path: incidentping-deployment.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
